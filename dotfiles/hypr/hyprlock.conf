general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgb(282828)
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_size = 72
    font_family = Berkeley Mono
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(d79921)
    inner_color = rgb(3c3836)
    font_color = rgb(ebdbb2)
    check_color = rgb(98971a)
    fail_color = rgb(cc241d)
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -50
    halign = center
    valign = center
}
