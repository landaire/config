# Nix Darwin rebuild tasks

[tasks."rebuild:caladan"]
description = "Rebuild nix-darwin configuration for caladan"
run = "sudo nix run 'nix-darwin/master#darwin-rebuild' -- switch --flake 'path:.#caladan'"

[tasks."rebuild:salusa"]
description = "Rebuild nix-darwin configuration for salusa"
run = "sudo nix run 'nix-darwin/master#darwin-rebuild' -- switch --flake 'path:.#salusa'"

[tasks."rebuild:ix"]
description = "Rebuild nix-darwin configuration for ix"
run = "sudo nix run 'nix-darwin/master#darwin-rebuild' -- switch --flake .#ix"

[tasks."rebuild:work"]
description = "Rebuild nix-darwin configuration for work machine (landerb-mac2)"
run = "sudo nix run 'nix-darwin/master#darwin-rebuild' -- switch --flake 'path:.#landerb-mac2'"

[tasks."rebuild:rossak"]
description = "Rebuild nix-darwin configuration for rossak"
run = "sudo nix run 'nix-darwin/master#darwin-rebuild' -- switch --flake 'path:.#rossak'"


[tasks."rebuild:richese"]
description = "richese: full switch (home + apps + system)"
run = "nix run .#richese-switch -- --all"

[tasks."rebuild:richese:home"]
description = "richese: link managed home files + user packages (no sudo)"
run = "nix run .#richese-switch -- --home"

[tasks."rebuild:richese:apps"]
description = "richese: sync flatpaks"
run = "nix run .#richese-switch -- --apps"

[tasks."rebuild:richese:system"]
description = "richese: rpm-ostree provision + managed policies (sudo)"
run = "nix run .#richese-switch -- --system"

[tasks.rebuild]
description = "List available rebuild targets"
run = """
echo "Available rebuild targets:"
echo "  mise run rebuild:caladan  - Rebuild for caladan"
echo "  mise run rebuild:salusa   - Rebuild for salusa"
echo "  mise run rebuild:work     - Rebuild for work machine"
"""
